<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .contact-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 450px;
            width: 100%;
            padding: 30px;
            text-align: center;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #e2e8f0;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            color: #4f46e5;
            font-weight: bold;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 25px;
        }

        .info-list {
            list-style: none;
            text-align: left;
            margin-bottom: 25px;
        }

        .info-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f8fafc;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #e2e8f0;
        }

        .info-label {
            font-weight: 600;
            width: 80px;
            color: #4f46e5;
            font-size: 0.9rem;
        }

        .info-value a {
            color: #333;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .info-value a:hover {
            color: #4f46e5;
            text-decoration: underline;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }

        .social-btn {
            padding: 8px 16px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .social-btn:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <div class="profile-img">Mr.</div>

        <h1>Ashraf Shaikh</h1>
        <p class="subtitle">Mca student</p>

        <ul class="info-list">
            <li class="info-item">
                <span class="info-label">Email:</span>
                <span class="info-value"><a href="mailto:your.email@example.com">your.email@example.com</a></span>
            </li>
            <li class="info-item">
                <span class="info-label">Phone:</span>
                <span class="info-value"><a href="tel:+919876543210">+91 9960842871</a></span>
            </li>
            <li class="info-item">
                <span class="info-label">Location:</span>
                <span class="info-value" style="color: #333;">Nashik, India</span>
            </li>
        </ul>

        <div class="social-links">
            <a href="https://linkedin.com" target="_blank" class="social-btn">LinkedIn</a>
            <a href="https://github.com" target="_blank" class="social-btn">GitHub / Portfolio</a>
        </div>
    </div>

</body>
</html>
